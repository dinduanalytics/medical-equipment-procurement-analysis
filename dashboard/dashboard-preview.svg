<text x="44" y="613">Ahmed Hassan</text><rect class="bar" x="170" y="599" width="215" height="17" rx="3"/><text x="395" y="612" text-anchor="end" fill="#fff">4.3M</text>
<text x="44" y="646">Anna Lee</text><rect class="bar" x="170" y="632" width="155" height="17" rx="3"/><text x="335" y="645" text-anchor="end" fill="#fff">3.1M</text>
<text x="44" y="679">Jessica Brown</text><rect class="bar" x="170" y="665" width="115" height="17" rx="3"/><text x="295" y="678" text-anchor="end" fill="#fff">2.3M</text></g>
<rect class="panel" x="600" y="464" width="576" height="260" rx="12"/><text class="label" x="620" y="492">AVERAGE DELIVERY TIME BY SUPPLIER</text><text class="tiny" x="620" y="510">Days between order and delivery</text>
<line x1="640" y1="672" x2="1138" y2="672" stroke="#d5dfcf"/><line x1="640" y1="550" x2="640" y2="672" stroke="#d5dfcf"/>
<polyline class="line" points="650,585 710,594 770,580 830,600 890,594 950,610 1010,601 1070,614 1130,605"/>
<g class="dot"><circle cx="650" cy="585" r="4"/><circle cx="710" cy="594" r="4"/><circle cx="770" cy="580" r="4"/><circle cx="830" cy="600" r="4"/><circle cx="890" cy="594" r="4"/><circle cx="950" cy="610" r="4"/><circle cx="1010" cy="601" r="4"/><circle cx="1070" cy="614" r="4"/><circle cx="1130" cy="605" r="4"/></g>
<g class="tiny"><text x="650" y="693" text-anchor="middle">A</text><text x="710" y="693" text-anchor="middle">B</text><text x="770" y="693" text-anchor="middle">C</text><text x="830" y="693" text-anchor="middle">D</text><text x="890" y="693" text-anchor="middle">E</text><text x="950" y="693" text-anchor="middle">F</text><text x="1010" y="693" text-anchor="middle">G</text><text x="1070" y="693" text-anchor="middle">H</text><text x="1130" y="693" text-anchor="middle">I</text></g>
<text class="tiny" x="600" y="747">Portfolio preview recreation — verify chart labels and KPI definitions against the original workbook.</text>
