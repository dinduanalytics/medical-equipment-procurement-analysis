<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><style>
.bg{fill:#f2f5ef}.panel{fill:#fff;stroke:#d9e2d3;stroke-width:1.5}.green{fill:#477c2c}.dark{fill:#24491f}.muted{fill:#6d7868}.title{font:700 25px Arial,sans-serif;fill:#fff}.subtitle{font:12px Arial,sans-serif;fill:#e7f2dc}.label{font:700 12px Arial,sans-serif;fill:#52634b}.value{font:700 23px Arial,sans-serif;fill:#254a20}.small{font:11px Arial,sans-serif;fill:#52634b}.tiny{font:10px Arial,sans-serif;fill:#6d7868}.bar{fill:#70a849}.bar2{fill:#a3c77b}.line{fill:none;stroke:#477c2c;stroke-width:3}.dot{fill:#477c2c}
</style></defs>
<rect class="bg" width="1200" height="760"/>
<rect class="green" width="1200" height="66"/>
<text x="30" y="31" class="title">MEDICAL PROCUREMENT DASHBOARD</text><text x="30" y="50" class="subtitle">Procurement cost • Equipment condition • Supplier performance</text>
<rect x="1010" y="16" width="160" height="34" rx="6" fill="#f4f7ef"/><text x="1090" y="37" text-anchor="middle" class="label">DASHBOARD VIEW</text>
<!-- KPI cards -->
<g>
<rect class="panel" x="24" y="84" width="220" height="94" rx="10"/><rect class="green" x="24" y="84" width="220" height="8" rx="4"/><text class="label" x="42" y="112">TOTAL PROCUREMENT COST</text><text class="value" x="42" y="145">$21.64M</text><text class="tiny" x="42" y="163">Displayed dashboard value</text>
<rect class="panel" x="260" y="84" width="220" height="94" rx="10"/><rect class="green" x="260" y="84" width="220" height="8" rx="4"/><text class="label" x="278" y="112">AVERAGE DELIVERY TIME</text><text class="value" x="278" y="145">25 days</text><text class="tiny" x="278" y="163">Rounded display value</text>
<rect class="panel" x="496" y="84" width="220" height="94" rx="10"/><rect class="green" x="496" y="84" width="220" height="8" rx="4"/><text class="label" x="514" y="112">ANNUAL MAINTENANCE</text><text class="value" x="514" y="145">$461.4K</text><text class="tiny" x="514" y="163">Displayed dashboard value</text>
<rect class="panel" x="732" y="84" width="220" height="94" rx="10"/><rect class="green" x="732" y="84" width="220" height="8" rx="4"/><text class="label" x="750" y="112">INSTALLATION COST</text><text class="value" x="750" y="145">$275.1K</text><text class="tiny" x="750" y="163">Displayed dashboard value</text>
<rect class="panel" x="968" y="84" width="208" height="94" rx="10"/><rect class="green" x="968" y="84" width="208" height="8" rx="4"/><text class="label" x="986" y="112">AVERAGE UNIT PRICE</text><text class="value" x="986" y="145">$37,519</text><text class="tiny" x="986" y="163">Displayed dashboard value</text>
</g>
<!-- top left hospital bar chart -->
<rect class="panel" x="24" y="196" width="560" height="250" rx="12"/><text class="label" x="44" y="223">TOP SPENDING HOSPITALS</text><text class="tiny" x="44" y="241">Procurement amount (as shown in dashboard)</text>
<g class="small">
<text x="44" y="274">Minna Federal Medical Center</text><rect class="bar" x="235" y="260" width="280" height="17" rx="3"/><text x="525" y="273" text-anchor="end" fill="#fff">1.8M</text>
<text x="44" y="306">Dutse General Hospital</text><rect class="bar" x="235" y="292" width="230" height="17" rx="3"/><text x="457" y="305" text-anchor="end" fill="#fff">1.5M</text>
<text x="44" y="338">Gusau General Hospital</text><rect class="bar" x="235" y="324" width="205" height="17" rx="3"/><text x="432" y="337" text-anchor="end" fill="#fff">1.3M</text>
<text x="44" y="370">Katsina Federal Medical Center</text><rect class="bar" x="235" y="356" width="185" height="17" rx="3"/><text x="412" y="369" text-anchor="end" fill="#fff">1.2M</text>
<text x="44" y="402">Umuahia General Hospital</text><rect class="bar" x="235" y="388" width="150" height="17" rx="3"/><text x="377" y="401" text-anchor="end" fill="#fff">1.0M</text>
</g>
<!-- equipment -->
<rect class="panel" x="600" y="196" width="270" height="250" rx="12"/><text class="label" x="620" y="223">MOST PURCHASED EQUIPMENT</text><text class="tiny" x="620" y="241">Quantity comparison</text>
<g><rect class="bar" x="632" y="280" width="40" height="120" rx="3"/><rect class="bar2" x="685" y="302" width="40" height="98" rx="3"/><rect class="bar" x="738" y="318" width="40" height="82" rx="3"/><rect class="bar2" x="791" y="337" width="40" height="63" rx="3"/>
<text class="tiny" x="652" y="418" text-anchor="middle">Defibrillator</text><text class="tiny" x="705" y="418" text-anchor="middle">Phototherapy</text><text class="tiny" x="758" y="430" text-anchor="middle">Monitor</text><text class="tiny" x="811" y="430" text-anchor="middle">Other</text></g>
<!-- insight panel -->
<rect class="panel" x="886" y="196" width="290" height="250" rx="12"/><text class="label" x="906" y="223">KEY INSIGHTS &amp; ACTIONS</text>
<circle cx="909" cy="250" r="4" fill="#70a849"/><text class="small" x="922" y="254">Review high-spending hospitals for</text><text class="small" x="922" y="270">drivers of procurement totals.</text>
<circle cx="909" cy="294" r="4" fill="#70a849"/><text class="small" x="922" y="298">Compare maintenance by equipment</text><text class="small" x="922" y="314">type before prioritising budgets.</text>
<circle cx="909" cy="338" r="4" fill="#70a849"/><text class="small" x="922" y="342">Monitor supplier delivery times and</text><text class="small" x="922" y="358">follow up on delays.</text>
<circle cx="909" cy="382" r="4" fill="#70a849"/><text class="small" x="922" y="386">Validate dashboard totals against</text><text class="small" x="922" y="402">the underlying source workbook.</text>
<!-- bottom charts -->
<rect class="panel" x="24" y="464" width="560" height="260" rx="12"/><text class="label" x="44" y="492">SUPPLIER SPEND CONTRIBUTION</text><text class="tiny" x="44" y="510">Illustrative ranking view — confirm measure definition</text>
<g class="small"><text x="44" y="547">Emily Johnson</text><rect class="bar" x="170" y="533" width="320" height="17" rx="3"/><text x="500" y="546" text-anchor="end" fill="#fff">6.7M</text>
