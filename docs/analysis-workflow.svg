<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Medical Equipment Procurement Analysis Workflow</title>
<desc id="desc">A step-by-step flowchart from business questions through data preparation, analysis, dashboarding, validation, and recommendations.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#557b65"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#173e2e" flood-opacity=".12"/></filter>
</defs>
<rect width="1200" height="900" rx="24" fill="#f5f8f5"/>
<text x="600" y="60" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#173e2e">Medical Equipment Procurement Analysis</text>
<text x="600" y="94" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#587263">Project workflow · Excel-based analysis</text>
<g font-family="Arial,Helvetica,sans-serif" filter="url(#shadow)">
  <rect x="285" y="130" width="630" height="78" rx="16" fill="#174a35"/>
  <text x="600" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#b9e58a" letter-spacing="2">STEP 1</text>
  <text x="600" y="188" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">Understand the 7 business questions</text>
  <rect x="285" y="252" width="630" height="78" rx="16" fill="#ffffff" stroke="#c9d9cc" stroke-width="2"/>
  <text x="600" y="283" text-anchor="middle" font-size="14" font-weight="700" fill="#6b9478" letter-spacing="2">STEP 2</text>
  <text x="600" y="309" text-anchor="middle" font-size="23" font-weight="700" fill="#173e2e">Inspect the dataset and field meanings</text>
  <rect x="285" y="374" width="630" height="78" rx="16" fill="#ffffff" stroke="#c9d9cc" stroke-width="2"/>
  <text x="600" y="405" text-anchor="middle" font-size="14" font-weight="700" fill="#6b9478" letter-spacing="2">STEP 3</text>
  <text x="600" y="431" text-anchor="middle" font-size="23" font-weight="700" fill="#173e2e">Clean and validate data in Excel</text>
  <rect x="285" y="496" width="630" height="78" rx="16" fill="#ffffff" stroke="#c9d9cc" stroke-width="2"/>
  <text x="600" y="527" text-anchor="middle" font-size="14" font-weight="700" fill="#6b9478" letter-spacing="2">STEP 4</text>
  <text x="600" y="553" text-anchor="middle" font-size="23" font-weight="700" fill="#173e2e">Calculate KPIs and analyse patterns</text>
  <rect x="285" y="618" width="630" height="78" rx="16" fill="#ffffff" stroke="#c9d9cc" stroke-width="2"/>
  <text x="600" y="649" text-anchor="middle" font-size="14" font-weight="700" fill="#6b9478" letter-spacing="2">STEP 5</text>
  <text x="600" y="675" text-anchor="middle" font-size="23" font-weight="700" fill="#173e2e">Build charts and dashboard views</text>
  <rect x="285" y="740" width="630" height="78" rx="16" fill="#174a35"/>
  <text x="600" y="771" text-anchor="middle" font-size="14" font-weight="700" fill="#b9e58a" letter-spacing="2">STEP 6</text>
  <text x="600" y="797" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">Validate findings and recommend actions</text>
</g>
<g stroke="#557b65" stroke-width="3" fill="none" marker-end="url(#arrow)">
  <path d="M600 208 V244"/><path d="M600 330 V366"/><path d="M600 452 V488"/><path d="M600 574 V610"/><path d="M600 696 V732"/>
</g>
<text x="600" y="858" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#587263">Check each dashboard KPI against the source workbook before publishing conclusions.</text>
</svg>